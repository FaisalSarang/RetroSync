# ==================== NETWORKS ====================
networks:
  retrosync-network:
    driver: bridge
    name: retrosync-network

# ==================== VOLUMES ====================
volumes:
  postgres-data:
    name: retrosync-postgres-data
  redis-data:
    name: retrosync-redis-data
  rabbitmq-data:
    name: retrosync-rabbitmq-data
  minio-data:
    name: retrosync-minio-data
  prometheus-data:
    name: retrosync-prometheus-data
  grafana-data:
    name: retrosync-grafana-data
