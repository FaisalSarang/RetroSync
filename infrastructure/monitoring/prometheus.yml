global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Infrastructure monitoring
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15672']

  # Application services (uncomment when services are ready)
  # - job_name: 'user-service'
  #   static_configs:
  #     - targets: ['user-service:8080']

  # - job_name: 'config-service'
  #   static_configs:
  #     - targets: ['config-service:8081']

  # - job_name: 'save-service'
  #   static_configs:
  #     - targets: ['save-service:8082']

  # - job_name: 'sync-service'
  #   static_configs:
  #     - targets: ['sync-service:8083']
